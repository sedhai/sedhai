
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sedhai.com - Ecosystem Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff007f;
            --bg-color: #050510;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(188, 19, 254, 0.05), transparent 25%);
        }

        .font-mono {
            font-family: 'Space Mono', monospace;
        }

        .perspective {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.hovered .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .flip-card-front {
            background: linear-gradient(145deg, #11111a, #1a1a2e);
        }

        .flip-card-back {
            background: linear-gradient(145deg, #1a1a2e, #2d1b4e);
            transform: rotateY(180deg);
            border: 1px solid var(--neon-purple);
        }

        /* Colorful Glowing Borders via pseudo-elements */
        .flip-card-front::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            z-index: -1;
            border-radius: 1.1rem;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .flip-card.hovered .flip-card-front::before {
            opacity: 1;
            filter: blur(8px);
        }

        /* Entry Animation Setup */
        .flip-card {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .flip-card.entered {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes glitchExit {
            0% { filter: blur(0px) contrast(100%) hue-rotate(0deg); transform: translate(0); }
            20% { filter: blur(4px) contrast(200%) hue-rotate(90deg); transform: translate(-5px, 5px); }
            40% { filter: blur(2px) contrast(300%) hue-rotate(-90deg); transform: translate(5px, -5px) skewX(10deg); }
            60% { filter: blur(6px) contrast(150%) hue-rotate(45deg); transform: translate(-2px, -2px) skewX(-10deg); }
            80% { filter: blur(2px) contrast(250%) hue-rotate(180deg); transform: translate(2px, 2px); }
            100% { filter: blur(0px) contrast(100%) hue-rotate(0deg); transform: translate(0); }
        }

        .glitch-exit .flip-card-inner {
            animation: glitchExit 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes zoomOutFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.5) translateZ(-500px); opacity: 0; pointer-events: none; }
        }

        .zoom-out {
            animation: zoomOutFade 0.6s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }

        /* Loader specific styles */
        .pulse-logo {
            animation: pulseLogo 2s infinite alternate;
        }

        @keyframes pulseLogo {
            0% { text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue); transform: scale(1); }
            100% { text-shadow: 0 0 30px var(--neon-purple), 0 0 60px var(--neon-pink); transform: scale(1.1); }
        }

        /* Iframe Overlay */
        #iframe-overlay {
            backdrop-filter: blur(20px);
            background: rgba(0,0,0,0.85);
            transition: opacity 0.5s ease;
        }
        
        .iframe-container {
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 50px rgba(188, 19, 254, 0.3);
        }
        
        .hide { display: none !important; }
        .invisible { opacity: 0; pointer-events: none; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Loading Screen / Init Context -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#050510] transition-opacity duration-1000">
        <div class="text-8xl font-black mb-8 pulse-logo tracking-tighter">S</div>
        <h1 class="text-2xl font-mono mb-12 tracking-[0.3em] text-gray-400 uppercase">sedhai.com</h1>
        <p class="text-sm font-mono text-gray-500 mb-8 blink">AWAITING CONNECTION...</p>
        
        <button id="init-btn" class="px-8 py-4 bg-transparent border border-cyan-400 text-cyan-400 font-mono hover:bg-cyan-400 hover:text-black transition-all duration-300 rounded-lg group relative overflow-hidden">
            <span class="relative z-10 font-bold uppercase tracking-widest">Initialize Network</span>
            <div class="absolute inset-0 h-full w-0 bg-cyan-400 transition-all duration-300 ease-out group-hover:w-full z-0"></div>
        </button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-7xl mx-auto px-4 py-12 flex flex-col relative z-10" id="main-content">
        
        <header class="text-center mb-16 opacity-0 transition-opacity duration-1000" id="main-header">
            <h1 class="text-4xl md:text-5xl font-black mb-4 bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500">
                Sedhai Ecosystem Hub
            </h1>
            <p class="text-gray-400 font-mono max-w-2xl mx-auto">
                Live Network Active. Hover cards to reveal core nodes. Click to establish direct encrypted links.
            </p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 pb-12" id="grid-container">
            <!-- Cards injected via JS -->
        </div>

        <footer class="mt-auto text-center py-6 text-xs text-gray-600 font-mono">
            &copy; 2026 sedhai.com. Network Secured.
        </footer>
    </main>

    <!-- Iframe Overlay -->
    <div id="iframe-overlay" class="fixed inset-0 z-40 invisible flex flex-col p-4 md:p-8">
        <div class="w-full max-w-7xl mx-auto flex justify-between items-center mb-4">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
                <h2 id="iframe-title" class="font-mono text-xl font-bold text-white">Connection Established</h2>
            </div>
            <div class="flex gap-4">
                <a id="iframe-ext-link" href="#" target="_blank" class="px-4 py-2 border border-gray-600 rounded text-sm hover:bg-gray-800 transition">Open External &nearr;</a>
                <button id="iframe-close" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded transition">CLOSE [X]</button>
            </div>
        </div>
        
        <div class="flex-1 w-full max-w-7xl mx-auto rounded-xl overflow-hidden iframe-container relative bg-black">
            <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div class="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <span class="font-mono text-cyan-500">ESTABLISHING UPLINK...</span>
            </div>
            <iframe id="target-iframe" src="" class="w-full h-full border-none relative z-10 bg-white" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        </div>
    </div>

    <script>
        // Project Data Model
        const projects = [
            { name: 'Edilco AU', url: 'https://edilco.com.au', desc: 'Construction & Corporate Portal', status: 'active' },
            { name: 'Edilco Home', url: 'https://edilcohome.com.au', desc: 'Residential Solutions & Homes', status: 'active' },
            { name: 'Edilco Builder', url: 'https://edilcobuilder.com.au', desc: 'Commercial Builders Network', status: 'active' },
            { name: 'Hamro AU', url: 'https://hamro.com.au', desc: 'Community Portal & Services', status: 'active' },
            { name: 'Tradie Girl', url: 'https://tradiegirl.web.app', desc: 'Trade Services Web App', status: 'active' },
            { name: 'Manab App', url: 'https://manab.web.app', desc: 'Portfolio & Cloud App', status: 'active' },
            { name: 'Bimal App', url: 'https://bimal.web.app', desc: 'Developer Workspace', status: 'active' },
            { name: 'Web3 Portal', url: 'https://ethereum.org', desc: 'Smart Contracts & DApps', status: 'active', btnText: 'Launch DApp' },
            { name: 'PTE Dream', url: 'https://pte.dream', desc: 'AI Practice & Test Prep', status: 'active', btnText: 'Start Prep' },
            { name: 'Build Your Dream', url: 'https://buildyour.dream', desc: 'Startup & Innovation Platform', status: 'active', btnText: 'Explore' },
            { name: 'Future Slot 1', url: '#', desc: 'Add domain or link details here.', status: 'inactive' },
            { name: 'Future Slot 2', url: '#', desc: 'Add domain or link details here.', status: 'inactive' },
            { name: 'Future Slot 3', url: '#', desc: 'Add domain or link details here.', status: 'inactive' },
            { name: 'Future Slot 4', url: '#', desc: 'Add domain or link details here.', status: 'inactive' },
            { name: 'Future Slot 5', url: '#', desc: 'Add domain or link details here.', status: 'inactive' }
        ];

        // Web Audio API Context
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'startup') {
                // Deep sweeping swell
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(50, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 1.5);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.2, now + 0.5);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                osc.start(now);
                osc.stop(now + 1.5);
            } 
            else if (type === 'hover') {
                // Quick digital blip
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            }
            else if (type === 'click') {
                // Deep warp/confirm
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const gridContainer = document.getElementById('grid-container');

        projects.forEach((proj, index) => {
            const isInactive = proj.status === 'inactive';
            const btnText = proj.btnText || (isInactive ? 'Inactive' : 'Visit Website');
            const displayUrl = isInactive ? 'Available for expansion' : proj.url.replace('https://', '');
            const themeClass = isInactive ? 'text-gray-500' : 'text-cyan-400';

            const cardHTML = `
                <div class="h-64 perspective flip-card cursor-pointer group" data-index="${index}" data-url="${proj.url}" style="transition-delay: ${index * 100}ms">
                    <div class="flip-card-inner shadow-2xl">
                        <!-- Front of Card -->
                        <div class="flip-card-front">
                            <h2 class="text-2xl font-bold mb-2 ${isInactive ? 'text-gray-400' : 'text-white'}">${proj.name}</h2>
                            <p class="font-mono text-sm ${themeClass} mb-6">${displayUrl}</p>
                            <span class="text-xs tracking-widest uppercase text-gray-500 group-hover:text-cyan-300 transition-colors">
                                ${isInactive ? 'Coming Soon' : 'Hover to Visit &rarr;'}
                            </span>
                        </div>
                        
                        <!-- Back of Card -->
                        <div class="flip-card-back">
                            <h3 class="text-xl font-bold mb-2 text-white">${proj.name}</h3>
                            <p class="text-sm text-gray-300 mb-6 px-4">${proj.desc}</p>
                            
                            <button class="px-6 py-2 rounded-full font-mono text-sm font-bold transition-all
                                ${isInactive 
                                    ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700' 
                                    : 'bg-gradient-to-r from-cyan-500 to-purple-600 text-white hover:shadow-[0_0_15px_rgba(0,243,255,0.6)]'}">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            gridContainer.insertAdjacentHTML('beforeend', cardHTML);
        });

        const initBtn = document.getElementById('init-btn');
        const loader = document.getElementById('loader');
        const header = document.getElementById('main-header');
        const cards = document.querySelectorAll('.flip-card');
        
        const iframeOverlay = document.getElementById('iframe-overlay');
        const iframeEl = document.getElementById('target-iframe');
        const iframeClose = document.getElementById('iframe-close');
        const iframeTitle = document.getElementById('iframe-title');
        const iframeExtLink = document.getElementById('iframe-ext-link');
        let activeCard = null;

        // Init Button Click
        initBtn.addEventListener('click', () => {
            initAudio();
            playSound('startup');
            
            // Fade out loader
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.classList.add('hide');
                
                // Show header
                header.style.opacity = '1';
                
                // Trigger staggered card entry
                cards.forEach(card => {
                    // Slight timeout to ensure display changes register
                    setTimeout(() => {
                        card.classList.add('entered');
                    }, 50);
                });
            }, 1000);
        });

        // Card Hover & Click Interactions
        cards.forEach(card => {
            let glitchTimeout;

            // Hover IN
            card.addEventListener('mouseenter', () => {
                const isInactive = projects[card.dataset.index].status === 'inactive';
                if(!isInactive && !card.classList.contains('zoom-out')) {
                    card.classList.add('hovered');
                    playSound('hover');
                }
            });

            // Hover OUT (Trigger Glitch)
            card.addEventListener('mouseleave', () => {
                if (card.classList.contains('hovered')) {
                    card.classList.remove('hovered');
                    card.classList.add('glitch-exit');
                    
                    clearTimeout(glitchTimeout);
                    glitchTimeout = setTimeout(() => {
                        card.classList.remove('glitch-exit');
                    }, 400); // match animation duration
                }
            });

            // Click -> Zoom Out & Open Iframe
            card.addEventListener('click', (e) => {
                const proj = projects[card.dataset.index];
                if (proj.status === 'inactive') return;
                
                playSound('click');
                activeCard = card;
                
                // Apply Zoom Out
                card.classList.add('zoom-out');
                
                // Show Iframe Overlay after short delay
                setTimeout(() => {
                    iframeOverlay.classList.remove('invisible');
                    iframeOverlay.style.opacity = '1';
                    
                    iframeTitle.innerText = `LINKING TO: ${proj.name.toUpperCase()}`;
                    iframeExtLink.href = proj.url;
                    
                    // Delay setting src to show loader slightly
                    setTimeout(() => {
                        iframeEl.src = proj.url;
                        // Note: Many sites block iframe embedding via X-Frame-Options.
                        // The external link is provided as a fallback.
                    }, 500);
                    
                }, 600); // wait for zoom out
            });
        });

        // Close Iframe
        iframeClose.addEventListener('click', () => {
            playSound('hover'); // Small feedback
            
            iframeOverlay.style.opacity = '0';
            iframeEl.src = ''; // clear iframe
            
            setTimeout(() => {
                iframeOverlay.classList.add('invisible');
                
                // Restore card
                if (activeCard) {
                    activeCard.classList.remove('zoom-out');
                    activeCard.classList.remove('hovered'); // ensure it flips back
                    activeCard = null;
                }
            }, 500);
        });

    </script>
</body>
</html>
